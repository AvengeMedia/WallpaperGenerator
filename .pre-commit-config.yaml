repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json

  - repo: local
    hooks:
      - id: vp staged
        name: vp staged
        entry: npx vp staged
        language: system
        pass_filenames: false
