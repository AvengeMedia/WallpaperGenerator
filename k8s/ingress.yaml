apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallpaper-generator-ingress
  namespace: wallpaper
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - wallpaper.danklinux.com
      secretName: wallpaper-generator-tls-secret
  rules:
    - host: wallpaper.danklinux.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallpaper-generator
                port:
                  number: 8080
